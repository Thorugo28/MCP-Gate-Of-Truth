# /admin fica aberto até a fase 4 (controle de acesso): só escuta local.
server:
  address: 127.0.0.1

spring:
  application:
    name: mcp-gate-of-truth
  # sem usuário/senha gerados pelo Boot: a autenticação é só por chave de acesso (security/AccessKeyFilter)
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  ai:
    mcp:
      client:
        # desligado: o gateway cria os clientes (UpstreamClientFactory) para conseguir reconectar; as propriedades abaixo
        # (name, version, request-timeout e stdio.connections) continuam valendo
        enabled: false
        name: gate-of-truth-client
        version: 0.0.1
        type: SYNC
        request-timeout: 60s
        toolcallback:
          enabled: false
        stdio:
          connections:
            notion:
              command: ${NPX_CMD:npx}
              args:
                - "-y"
                - "@notionhq/notion-mcp-server"
              env:
                NOTION_TOKEN: ${NOTION_TOKEN}
                PATH: ${NODE_BIN:/usr/bin}:${PATH}
            filesystem:
              command: ${NPX_CMD:npx}
              args:
                - "-y"
                - "@modelcontextprotocol/server-filesystem"
                - "${MCP_SANDBOX_DIR:${user.home}/mcp-sandbox}"
              env:
                PATH: ${NODE_BIN:/usr/bin}:${PATH}
      server:
        # desligado: o gateway monta um servidor por chave de acesso (proxy/KeyServers); as propriedades abaixo
        # (name, version, protocol, streamable-http.*) continuam valendo
        enabled: false
        name: MCP Gate of Truth
        version: 0.0.1
        protocol: STREAMABLE

# Fase 5: health aberto; metrics (gate.tool.calls, gate.upstream.*) só para chave com admin: true (config/SecurityConfig)
management:
  endpoints:
    web:
      exposure:
        include: health, metrics

gate:
  # Auditoria (fase 5): uma linha JSON por chamada de tool, nesse arquivo (ver logback-spring.xml). Relativo ao diretório de onde o gateway sobe.
  audit:
    file: logs/audit.json
    # quantas chamadas ficam em memória para o GET /admin/calls (somem ao reiniciar)
    recent-size: 500
  admin:
    cors-origins:
      - http://localhost:4200
  # Chaves de acesso (fase 4). O valor vem sempre de variável de ambiente (gerar com `openssl rand -hex 32`), nunca escrito aqui.
  # upstreams: chaves dos upstreams que a chave vê, ou "*" para todos. admin: pode usar o /admin.
  security:
    keys:
      cli:
        value: ${GATE_KEY_CLI:}
        upstreams: ["*"]
        admin: false
      painel:
        value: ${GATE_KEY_PANEL:}
        upstreams: ["*"]
        admin: true
